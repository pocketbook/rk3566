/*
 * More information about softvol is here http://alsa.opensrc.org/Softvol
 */
pcm.hp {
        type hw
        card 0
#       rate 44100
        channels 2

#       slave {
#                pcm     "hw:0,0"
#                rate    44100
#                channels 2
#        }
}

pcm.usb {
        type hw
        card 2
        channels 2
}


pcm.hwout_mix {
        type dmix
        ipc_key 11228890  # any unique value
        ipc_key_add_uid false
        ipc_perm 0777
        slave {
                pcm "hw:Loopback,0,0"
                format S16_LE
        #        period_time 0
                period_size 1024
                buffer_size 4096
                rate 48000
                channels 2
        }
}

pcm.appgroup1_sm {
        type            softvol
        slave.pcm       "plug:hwout_mix"
        control.name    "appgroup1_volume"
        control.card    0
}

pcm.vo_sm {
        type            softvol
        slave.pcm       "plug:hwout_mix"
        control.name    "vo_volume"
        control.card    0
}

pcm.mpd_sm {
        type            softvol
        slave.pcm       "plug:appgroup1_sm"
        control.name    "mpd_volume"
        control.card    0
}

pcm.tts_sm {
        type            softvol
        slave.pcm       "plug:appgroup1_sm"
        control.name    "tts_volume"
        control.card    0
}

pcm.browser_sm {
        type            softvol
        slave.pcm       "plug:appgroup1_sm"
        control.name    "browser_volume"
        control.card    0
}

@hooks [
    {
        func load
        files [
            "/var/run/bluealsa/"
        ]
    }
]
